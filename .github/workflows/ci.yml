name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # wrangler 4.x 要求 Node >=22.0.0（跑起来会直接报错拒绝执行），
      # 这里跟 package.json engines 字段对齐钉 22。
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # TODO(Remy): 确认 vitest 脚本名 + 是否需要单独跑 settlement.ts / fx-recommendation.ts 的覆盖率阈值检查
      - name: Unit tests (vitest)
        run: npm run test

      # opennextjs-cloudflare build 内部会先跑一次 next build 再打包成 Worker
      # 产物，一步顶原来「Build (next build)」+「Docker image build」两步——
      # 后者验证的是「这份代码真的能打包成能跑的产物」，现在换成验证能打包
      # 成 Cloudflare Worker（.open-next/worker.js），不再验证 Docker 镜像。
      - name: Build (opennextjs-cloudflare)
        run: npx opennextjs-cloudflare build
