name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # TODO(Remy): 确认 Node 版本锁定策略后调整（建议跟 package.json engines 字段对齐）
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # TODO(Remy): 确认 vitest 脚本名 + 是否需要单独跑 settlement.ts / fx-recommendation.ts 的覆盖率阈值检查
      - name: Unit tests (vitest)
        run: npm run test

      - name: Build (next build)
        run: npm run build

      # 2026-09-06 补：实测 docker compose up 时踩过两个只有真 build 才会暴露的坑
      # （缺 .dockerignore 导致宿主机编译的 better-sqlite3 原生绑定覆盖容器内版本、
      # 缺 public/ 目录导致 COPY 失败），当时 CI 没有这一步，两个坑都是手动跑
      # docker build 才发现的。补上这步防止同类问题再悄悄潜伏到发布时才暴露。
      - name: Docker image build
        run: docker build -f docker/Dockerfile -t trip-expense-ledger:ci .
