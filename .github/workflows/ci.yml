name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # TODO(Remy): 确认 Node 版本锁定策略后调整（建议跟 package.json engines 字段对齐）
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # TODO(Remy): 确认 vitest 脚本名 + 是否需要单独跑 settlement.ts / fx-recommendation.ts 的覆盖率阈值检查
      - name: Unit tests (vitest)
        run: npm run test

      - name: Build (next build)
        run: npm run build
