services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - '3000:3000'
    environment:
      DATABASE_PATH: /data/db.sqlite
      RECEIPTS_DIR: /data/receipts
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 里设一个随机的 SESSION_SECRET，参考 .env.example}
      PORT: 3000
    volumes:
      - ./data:/data
    restart: unless-stopped
